services:
  # -------------------------------------------------------------
  # 1. Next.js Frontend
  # -------------------------------------------------------------
  - type: web
    name: greenxchange-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.10.0
      - key: NEXT_PUBLIC_API_URL
        value: https://greenxchange-backend.onrender.com

  # -------------------------------------------------------------
  # 2. FastAPI Backend
  # -------------------------------------------------------------
  - type: web
    name: greenxchange-backend
    env: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        sync: false                    # Set in Render dashboard (Neon PostgreSQL)
      - key: REDIS_URL
        fromService:
          type: redis
          name: greenxchange-redis
          property: connectionString

      # ── Auth ──────────────────────────────────────────────────
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30

      # ── Email (Gmail API OAuth2 — works on Render free tier via HTTPS/443) ──
      - key: EMAIL_PROVIDER
        value: gmail_api
      - key: GMAIL_CLIENT_ID
        sync: false                    # Set in Render dashboard
      - key: GMAIL_CLIENT_SECRET
        sync: false                    # Set in Render dashboard
      - key: GMAIL_REFRESH_TOKEN
        sync: false                    # Set in Render dashboard
      - key: GMAIL_SENDER
        value: gogreenxchange.official@gmail.com
      - key: EMAIL_FROM
        value: "GreenXchange <gogreenxchange.official@gmail.com>"
      - key: SMTP_PASSWORD
        sync: false                    # Legacy fallback, keep for local dev
      - key: RESEND_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://greenxchange-frontend.onrender.com

      # ── AI / Groq ─────────────────────────────────────────────
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_CARE_API_KEY
        sync: false

      # ── CV Model Paths (bundled in Docker image at /app/models/) ──
      - key: TREE_MODEL_PATH
        value: /app/models/model1/tree_detector_resnet18.pth
      - key: PLANT_HEALTH_MODEL_PATH
        value: /app/models/model 2/new-plant_health_resnet18_balanced.pth

  # -------------------------------------------------------------
  # 3. Redis Service
  # -------------------------------------------------------------
  - type: redis
    name: greenxchange-redis
    plan: free
    ipAllowList: []



services:
  # -------------------------------------------------------------
  # 1. Next.js Frontend
  # -------------------------------------------------------------
  - type: web
    name: greenxchange-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.10.0
      - key: NEXT_PUBLIC_API_URL
        value: https://greenxchange-backend.onrender.com

  # -------------------------------------------------------------
  # 2. FastAPI Backend
  # -------------------------------------------------------------
  - type: web
    name: greenxchange-backend
    env: docker
    plan: starter          # $7/mo — required for PyTorch + model RAM (512 MB free tier insufficient)
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: greenxchange-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: greenxchange-redis
          property: connectionString

      # ── Auth ──────────────────────────────────────────────────
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: RS256                   # Fixed: was HS256, code uses RS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30

      # ── JWT RS256 Keys (set manually in Render dashboard) ─────
      - key: JWT_PRIVATE_KEY_B64
        sync: false
      - key: JWT_PUBLIC_KEY_B64
        sync: false

      # ── Email ─────────────────────────────────────────────────
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: gogreenxchange.official@gmail.com
      - key: SMTP_PASSWORD
        sync: false                    # Set in Render dashboard (app password)
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "GreenXchange <gogreenxchange.official@gmail.com>"
      - key: FRONTEND_URL
        value: https://greenxchange-frontend.onrender.com

      # ── AI / Groq ─────────────────────────────────────────────
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_CARE_API_KEY
        sync: false

      # ── CV Model Paths (bundled in Docker image at /app/models/) ──
      - key: TREE_MODEL_PATH
        value: /app/models/model1/tree_detector_resnet18.pth
      - key: PLANT_HEALTH_MODEL_PATH
        value: /app/models/model 2/new-plant_health_resnet18_balanced.pth

  # -------------------------------------------------------------
  # 3. Redis Service
  # -------------------------------------------------------------
  - type: redis
    name: greenxchange-redis
    plan: free
    ipAllowList: []

# ---------------------------------------------------------------
# PostgreSQL Database
# ---------------------------------------------------------------
databases:
  - name: greenxchange-db
    databaseName: greenxchange
    user: greenxchange
    plan: free
    ipAllowList: []

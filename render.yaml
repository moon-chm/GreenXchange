services:
  # -------------------------------------------------------------
  # 1. Next.js Frontend
  # -------------------------------------------------------------
  - type: web
    name: greenxchange-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.10.0
      - key: NEXT_PUBLIC_API_URL
        value: https://greenxchange-backend.onrender.com

  # -------------------------------------------------------------
  # 2. FastAPI Backend
  # -------------------------------------------------------------
  - type: web
    name: greenxchange-backend
    env: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: greenxchange-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: greenxchange-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: gogreenxchange.official@gmail.com
      - key: SMTP_PASSWORD
        sync: false   # Set manually in Render dashboard
      - key: EMAIL_FROM
        value: "GreenXchange <gogreenxchange.official@gmail.com>"
      - key: FRONTEND_URL
        value: https://greenxchange-frontend.onrender.com
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_CARE_API_KEY
        sync: false

  # -------------------------------------------------------------
  # 3. Redis Service
  # -------------------------------------------------------------
  - type: redis
    name: greenxchange-redis
    plan: free
    ipAllowList: []

# ---------------------------------------------------------------
# PostgreSQL Database
# ---------------------------------------------------------------
databases:
  - name: greenxchange-db
    databaseName: greenxchange
    user: greenxchange
    plan: free
    ipAllowList: []

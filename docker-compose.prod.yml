version: '3.8'

services:
  db:
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  redis:
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  minio:
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G

  backend:
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    restart: always
    command: npm run start
    deploy:
      resources:
        limits:
          memory: 512M

  nginx:
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
